name: PR Security Checks

on:
  pull_request:

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - run: mvn clean verify

  sast-scan:
    name: sast-scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - uses: github/codeql-action/init@v3
        with:
          languages: java

      - run: mvn clean verify

      - uses: github/codeql-action/analyze@v3

  block-pr-on-failure:
    name: block-pr-on-failure
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [integration-tests, sast-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Block merge when required checks fail
        run: |
          if [ "${{ needs.integration-tests.result }}" != "success" ] || [ "${{ needs.sast-scan.result }}" != "success" ]; then
            echo "Required checks failed; pull request is blocked from merging."
            exit 1
          fi
